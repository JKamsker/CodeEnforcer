name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Build tool package
        shell: pwsh
        run: ./scripts/build-tool.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: code-enforcer-tool-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
