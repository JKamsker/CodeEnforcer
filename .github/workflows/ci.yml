name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip
  CONFIGURATION: Release

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: global.json

      - name: Compute package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          }
          else {
            $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved package version: $version"

      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Build tool package
        shell: pwsh
        run: ./scripts/build-tool.ps1 -Configuration $env:CONFIGURATION -Version '${{ steps.version.outputs.version }}'

      - name: Upload package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-enforcer-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish-nuget:
    name: Publish to NuGet.org
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.repository == 'JKamsker/CodeEnforcer' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: code-enforcer-packages
          path: artifacts/packages

      - name: Fetch NuGet API key from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            265b2fb6-2cf0-4859-9bc8-b24c00ab4378 > NUGET_API_KEY

      - name: Push to NuGet.org
        shell: bash
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "Published version: ${{ needs.build.outputs.version }}"
