name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: global.json

      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Build tool package
        shell: pwsh
        run: ./scripts/build-tool.ps1

      - name: Upload package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-enforcer-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
